<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d6b36a">
<title>Bosniakisches Kulturzentrum Fedzr Display</title>
<style>
  /* Layout: Vollbild-Anzeige – Video im Hintergrund, Uhr in der Mitte, Gebetszeiten als Leiste unten */
  :root{
    color-scheme:dark;
    --accent:#d6b36a;
    --accent-bright:#f0d89a;
    --accent-soft:rgba(214,179,106,0.18);
    --glass:rgba(15,18,24,0.42);
    --glass-strong:rgba(10,13,18,0.72);
    --bar:rgba(14,18,24,0.76);
    --bg:#000;
    --text:rgba(255,255,255,0.96);
    --muted:rgba(255,255,255,0.82);
    --on-accent:#16120a;
    --shadow:0 10px 30px rgba(0,0,0,0.35);
    --font:"Segoe UI","Helvetica Neue",Arial,sans-serif;
  }

  *{ margin:0; padding:0; box-sizing:border-box; font-family:var(--font); }

  html, body{ width:100%; height:100%; }

  body{
    overflow:hidden;
    color:var(--text);
    background:var(--bg);
    position:relative;
  }

  .bg-video{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:-3; background:var(--bg);
  }

  .overlay{
    position:fixed; inset:0;
    background:
      linear-gradient(to bottom, rgba(0,0,0,0.32), rgba(0,0,0,0.68)),
      radial-gradient(circle at center, rgba(0,0,0,0.05), rgba(0,0,0,0.30));
    z-index:-2;
  }

  .screen{
    position:relative; z-index:1; width:100%; height:100%;
    display:flex; flex-direction:column;
  }

  .logo{
    position:absolute; top:26px; right:34px; width:120px; opacity:0.96;
    filter:drop-shadow(0 4px 12px rgba(0,0,0,0.35)); z-index:20;
  }

  .brand{
    position:absolute; top:24px; left:50%; transform:translateX(-50%);
    font-size:26px; font-weight:600; letter-spacing:0.5px;
    text-shadow:0 4px 14px rgba(0,0,0,0.35);
    text-align:center; white-space:nowrap; color:var(--text); z-index:20;
  }

  .hero{
    flex:1; display:flex; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; padding:40px 30px 210px;
  }

  .hero-line{
    width:120px; height:4px; border-radius:999px; margin-bottom:24px;
    background:linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow:0 0 18px rgba(214,179,106,0.25);
  }

  .clock{
    font-size:150px; font-weight:300; line-height:1; letter-spacing:2px;
    font-variant-numeric:tabular-nums;
    text-shadow:0 6px 18px rgba(0,0,0,0.28); margin-bottom:18px;
  }

  .date{
    font-size:34px; font-weight:600; color:var(--text); margin-bottom:10px;
    text-shadow:0 4px 14px rgba(0,0,0,0.25);
  }

  .hijri{
    font-size:28px; color:var(--muted);
    text-shadow:0 4px 14px rgba(0,0,0,0.25);
  }

  .top-info{
    position:absolute; left:50%; transform:translateX(-50%); bottom:230px;
    width:min(980px,88vw); min-height:120px;
    background:var(--glass); border:1px solid rgba(255,255,255,0.10);
    border-radius:24px; backdrop-filter:blur(12px); box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    padding:24px 30px; text-align:center; z-index:10;
  }

  .top-info-title{ font-size:20px; font-weight:700; color:var(--accent); margin-bottom:10px; }
  .top-info-main{ font-size:34px; line-height:1.45; color:var(--text); text-wrap:balance; }
  .top-info-sub{ margin-top:12px; font-size:16px; color:var(--muted); }

  .bottom-bar{
    position:absolute; left:0; right:0; bottom:0; height:195px;
    background:var(--bar); backdrop-filter:blur(14px);
    border-top:1px solid rgba(255,255,255,0.08);
    display:grid; grid-template-columns:1.05fr repeat(6, 1fr); gap:0;
    padding:18px 22px; box-shadow:0 -8px 28px rgba(0,0,0,0.28); z-index:10;
  }

  .left-card{
    display:flex; flex-direction:column; justify-content:center;
    padding:8px 12px; color:var(--accent); min-width:0;
  }

  .left-time{
    font-size:78px; line-height:1; font-weight:700; margin-bottom:8px;
    color:var(--accent); font-variant-numeric:tabular-nums;
  }
  .left-date{ font-size:20px; font-weight:700; text-transform:uppercase; margin-bottom:6px; color:var(--accent); }
  .left-hijri{ font-size:18px; color:rgba(214,179,106,0.88); }

  .prayer-card{
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    border-radius:18px; margin:0 6px; padding:12px 10px; transition:0.25s ease;
    position:relative; overflow:hidden; min-width:0;
  }

  .prayer-card::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent 35%);
    pointer-events:none;
  }

  .prayer-name{
    font-size:18px; font-weight:700; letter-spacing:0.3px; color:var(--accent);
    margin-bottom:10px; text-transform:uppercase; text-align:center;
  }

  .prayer-time{
    font-size:52px; font-weight:700; line-height:1; margin-bottom:12px;
    color:var(--accent); font-variant-numeric:tabular-nums;
  }

  .prayer-tag{
    min-height:34px; padding:8px 14px; border-radius:10px;
    background:var(--accent-soft); color:var(--text);
    font-size:14px; font-weight:700; display:flex; align-items:center;
    justify-content:center; text-align:center; min-width:86px;
  }

  .prayer-card.current{
    background:rgba(214,179,106,0.14);
    box-shadow:inset 0 0 0 2px rgba(214,179,106,0.34);
  }
  .prayer-card.current .prayer-name,
  .prayer-card.current .prayer-time{ color:var(--accent-bright); }
  .prayer-card.current .prayer-tag{ background:var(--accent); color:var(--on-accent); }

  .imam-card{
    position:absolute; top:110px; left:60px; width:180px;
    display:flex; flex-direction:column; align-items:center; gap:12px; z-index:20;
  }

  .imam-person{ display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; }

  .imam-photo{
    width:150px; height:150px; object-fit:cover; object-position:center top;
    border-radius:50%; border:4px solid var(--accent);
    box-shadow:0 8px 25px rgba(0,0,0,0.45); display:block;
    background:rgba(255,255,255,0.08);
  }

  .imam-name-box{
    display:block; width:100%; text-align:center;
    background:var(--glass-strong); backdrop-filter:blur(10px);
    padding:10px 16px; border-radius:14px; font-size:18px; color:var(--accent);
    font-weight:600; border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 8px 20px rgba(0,0,0,0.28);
  }

  @media (max-width: 1400px){
    .clock{ font-size:120px; }
    .date{ font-size:28px; }
    .hijri{ font-size:22px; }
    .top-info{ bottom:215px; }
    .bottom-bar{ grid-template-columns:1fr repeat(6, 1fr); height:180px; }
    .prayer-time{ font-size:42px; }
    .left-time{ font-size:64px; }
    .prayer-name{ font-size:15px; }
  }

  @media (max-width: 1100px){
    body{ overflow:auto; }
    .screen{ min-height:100%; height:auto; padding-inline:16px; }
    .brand{
      position:static; transform:none; margin-top:18px; white-space:normal;
      padding:0 100px 0 0; text-align:left; font-size:20px; text-wrap:balance;
    }
    .hero{ padding:30px 0 20px; }
    .top-info{
      position:static; transform:none; width:100%; min-height:0; margin-top:24px;
    }
    .bottom-bar{
      position:static; height:auto; grid-template-columns:repeat(2,1fr);
      padding:18px 8px; margin:24px -16px 0; row-gap:8px;
    }
    .left-card{ grid-column:1 / -1; }
    .logo{ width:95px; top:14px; right:16px; }
    .clock{ font-size:clamp(52px,17vw,88px); letter-spacing:0; }
    .date{ font-size:24px; }
    .hijri{ font-size:18px; }
    .top-info-main{ font-size:26px; }
    .imam-card{ position:static; width:220px; margin:20px auto 0; }
  }
</style>
</head>

  const WINKEL = { fajr: 18, isha: 17 };                                // Diyanet-Methode
  const videos = ["hintergrund.mp4.mp4", "video2.mp4"];

  const hadiths = [
    { de: "Die Taten werden nach den Absichten beurteilt.", bs: "Djela se vrednuju prema namjerama.", source: "Sahih al-Bukhari 1" },
    { de: "Die besten Menschen sind diejenigen mit dem besten Charakter.", bs: "Najbolji ljudi su oni koji imaju najljepše ponašanje.", source: "Sahih al-Bukhari 3559" },
    { de: "Ein Lächeln ist eine Sadaqa.", bs: "Osmijeh je sadaka.", source: "Jami at-Tirmidhi 1956" },
    { de: "Wer an Allah und den Jüngsten Tag glaubt soll Gutes sprechen oder schweigen.", bs: "Ko vjeruje u Allaha i Sudnji dan, neka govori dobro ili neka šuti.", source: "Sahih Muslim 6018" },
    { de: "Der Starke ist nicht derjenige der andere besiegt sondern der der seinen Zorn beherrscht.", bs: "Nije snažan onaj koji savlada druge, nego onaj koji savlada svoju srdžbu.", source: "Sahih al-Bukhari 6114" }
  ];

  const infos = {
    de: { title: "Information", main: "Freitag Dzuma: 13:30", sub: "Bei Fragen können Sie sich gerne im Büro melden." },
    bs: { title: "Informacije", main: "Dzuma Petak: 13:30", sub: "Ako imate pitanja, slobodno se javite u kancelariji." }
  };

  const prayerLabelsDE = { fajr: "FAJR", sunrise: "SONNENAUFGANG", dhuhr: "DHUHR", asr: "ASR", maghrib: "MAGHRIB", isha: "ISHA" };
  const prayerLabelsBS = { fajr: "SABAH", sunrise: "IZLAZAK SUNCA", dhuhr: "PODNE", asr: "IKINDIJA", maghrib: "AKŠAM", isha: "JACIJA" };
  const prayerTagsDE = { fajr: "", sunrise: "", dhuhr: "", asr: "", maghrib: "", isha: "" };
  const prayerTagsBS = { fajr: "", sunrise: "", dhuhr: "", asr: "", maghrib: "", isha: "" };
  /* --------------------------------------------------- */

  const KEYS = ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"];
  const $ = id => document.getElementById(id);

  let prayers = {};            // key -> Date
  let prayersDay = "";
  let currentLanguageIsBosnian = false;
  let currentTopBox = 0;
  let hijriText = "";

  /* Hintergrundvideos abwechselnd */
  let currentVideoIndex = 0;
  const bgVideo = $("bgVideo");
  function playCurrentVideo(){
    bgVideo.src = videos[currentVideoIndex];
    bgVideo.play().catch(() => {});
  }
  bgVideo.addEventListener("ended", () => {
    currentVideoIndex = (currentVideoIndex + 1) % videos.length;
    playCurrentVideo();
  });
  playCurrentVideo();

  /* Gebetszeiten: werden direkt auf der Seite aus dem Sonnenstand berechnet (kein Internet nötig) */
  function calcPrayers(y, m, d){
    const rad = Math.PI / 180;
    const sin = a => Math.sin(a * rad), cos = a => Math.cos(a * rad), tan = a => Math.tan(a * rad);
    const fix = (a, n) => ((a % n) + n) % n;
    const jd0 = Date.UTC(y, m - 1, d) / 86400000 + 2440587.5 - ORT.lng / 360;

    function sun(jd){
      const D = jd - 2451545.0;
      const g = fix(357.529 + 0.98560028 * D, 360);
      const q = fix(280.459 + 0.98564736 * D, 360);
      const L = fix(q + 1.915 * sin(g) + 0.020 * sin(2 * g), 360);
      const e = 23.439 - 0.00000036 * D;
      const RA = fix(Math.atan2(cos(e) * sin(L), cos(L)) / rad, 360) / 15;
      let eqt = q / 15 - RA; if(eqt > 12) eqt -= 24; if(eqt < -12) eqt += 24;
      return { decl: Math.asin(sin(e) * sin(L)) / rad, eqt };
    }
    const midDay = t => fix(12 - sun(jd0 + t / 24).eqt, 24);
    function angleTime(angle, t, before){
      const decl = sun(jd0 + t / 24).decl;
      const x = (-sin(angle) - sin(decl) * sin(ORT.lat)) / (cos(decl) * cos(ORT.lat));
      const h = Math.acos(Math.max(-1, Math.min(1, x))) / rad / 15;
      return midDay(t) + (before ? -h : h);
    }
    function asrTime(t){
      const decl = sun(jd0 + t / 24).decl;
      const angle = -Math.atan(1 / (1 + tan(Math.abs(ORT.lat - decl)))) / rad;
      return angleTime(angle, t, false);
    }

    let t = { fajr: 5, sunrise: 6, dhuhr: 12, asr: 13, maghrib: 18, isha: 18 };
    for(let i = 0; i < 2; i++){
      t = {
        fajr: angleTime(WINKEL.fajr, t.fajr, true),
        sunrise: angleTime(0.833, t.sunrise, true),
        dhuhr: midDay(t.dhuhr),
        asr: asrTime(t.asr),
        maghrib: angleTime(0.833, t.maghrib, false),
        isha: angleTime(WINKEL.isha, t.isha, false)
      };
    }
    const out = {};
    for(const k of KEYS){
      // Ortszeit (Sonne) -> UTC -> echter Zeitpunkt
      const utcHours = t[k] - ORT.lng / 15;
      out[k] = new Date(Date.UTC(y, m - 1, d) + Math.round(utcHours * 60) * 60000);
    }
    return out;
  }

  const fmtZone = new Intl.DateTimeFormat("de-DE", { timeZone: ORT.zone, hour: "2-digit", minute: "2-digit" });
  const fmtDay = new Intl.DateTimeFormat("en-CA", { timeZone: ORT.zone, year: "numeric", month: "2-digit", day: "2-digit" });

  function loadPrayers(){
    const now = new Date();
    const day = fmtDay.format(now);
    if(day === prayersDay) return;
    prayersDay = day;
    const [y, m, d] = day.split("-").map(Number);
    prayers = calcPrayers(y, m, d);
    for(const k of KEYS) $(k).textContent = fmtZone.format(prayers[k]);

    try{
      const parts = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {
        timeZone: ORT.zone, day: "numeric", month: "long", year: "numeric"
      }).formatToParts(now);
      const get = type => (parts.find(p => p.type === type) || {}).value || "";
      hijriText = get("day") + " " + get("month") + ", " + get("year");
    }catch(e){ hijriText = ""; }
    $("hijri").textContent = hijriText;
    $("barHijri").textContent = hijriText;
    updateTopInfo();
  }

  function updateClock(){
    const now = new Date();
    $("clock").textContent = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    $("date").textContent = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    $("barClock").textContent = now.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    $("barDate").textContent = now.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "short", year: "numeric" }).toUpperCase();
    loadPrayers();
    highlightCurrentPrayer(now);
  }

  function updateLabels(){
    const labels = currentLanguageIsBosnian ? prayerLabelsBS : prayerLabelsDE;
    const tags = currentLanguageIsBosnian ? prayerTagsBS : prayerTagsDE;
    for(const k of KEYS){
      $("label-" + k).textContent = labels[k];
      $("tag-" + k).textContent = tags[k];
      $("tag-" + k).hidden = !tags[k];
    }
    updateTopInfo();
  }

  function updateTopInfo(){
    if(currentTopBox === 0){
      const hadith = hadiths[new Date().getDate() % hadiths.length];
      $("topInfoTitle").textContent = currentLanguageIsBosnian ? "Hadis dana" : "Hadith des Tages";
      $("topInfoMain").textContent = currentLanguageIsBosnian ? hadith.bs : hadith.de;
      $("topInfoSub").textContent = "Quelle / Izvor: " + hadith.source;
    }else{
      const info = currentLanguageIsBosnian ? infos.bs : infos.de;
      $("topInfoTitle").textContent = info.title;
      $("topInfoMain").textContent = info.main;
      $("topInfoSub").textContent = info.sub;
    }
  }

  /* Aktuelles Gebet hervorheben (Isha gilt bis zum nächsten Fajr, auch nach Mitternacht) */
  function highlightCurrentPrayer(now){
    const order = ["fajr", "dhuhr", "asr", "maghrib", "isha"];
    let current = "isha";
    if(now >= prayers.fajr){
      for(const k of order) if(now >= prayers[k]) current = k;
    }
    for(const k of KEYS) $(k + "Card").classList.toggle("current", k === current);
  }

  updateLabels();
  updateClock();
  setInterval(updateClock, 1000);

  /* Sprache alle 20 Sekunden, Box-Wechsel alle 40 Sekunden */
  setInterval(() => { currentLanguageIsBosnian = !currentLanguageIsBosnian; updateLabels(); }, 20000);
  setInterval(() => { currentTopBox = currentTopBox === 0 ? 1 : 0; updateTopInfo(); }, 40000);
</script>
</body>
</html>
